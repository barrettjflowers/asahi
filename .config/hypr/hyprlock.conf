no_fade_in = false
grace = 5

background {
    path = /home/barrettjflowers/Pictures/wallpapers/city-lake-night.jpg
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] date "+%A, %B %-d  %-l:%M %p"
    font_size = 72
    font_family = JetBrainsMono Nerd Font Mono
    color = rgb(B5BBC7)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 0
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgb(3e3e3e)
    inner_color = rgb(3e3e3e)
    font_family = JetBrainsMono Nerd Font Mono:style=Medium
		font_size = 20
    font_color = rgb(B5BBC7)
    fade_on_empty = true
    placeholder_text = password...
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
