no_fade_in = true
grace = 5

source = ~/.config/colors/hyprland-colors.conf

background {
    path = /home/barrettjflowers/Pictures/wallpapers/mountain-brush.jpg
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] date "+%A, %B %-d  %-l:%M %p"
    font_size = 72
    font_family = Iosevka Nerd Font Mono 
    color = $text
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 0
    rounding = 16
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = $inactive
    inner_color = $inactive
    font_family = Iosevka Nerd Font Mono SemiBold
		font_size = 30
    font_color = $text
    fade_on_empty = true
    placeholder_text = password...
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
