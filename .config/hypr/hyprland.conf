# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua
monitor = eDP-1,2560x1664,0x0,1.6
env = WLR_DRM_NO_MODIFIERS,1
exec-once = ydotoold
exec-once = wl-paste --type text --watch cliphist store
exec-once = hyprpaper
exec-once = swayosd-server --top-margin 0.95
exec-once = waybar
exec-once = hyprsunset --temperature 4100 #warmup the display

# wait for hyprland to load and then reload the config 
#exec-once = sleep 3 && hyprctl reload

# bootstrap startup apps
exec-once = [workspace 1 silent] vivaldi
exec-once = [workspace 4 silent] flatpak run md.obsidian.Obsidian
exec-once = [workspace 3] kitty

$control = Super
$command = Control
$terminal = kitty
$menu = rofi -normal-window -show drun

bind = $control, W, killactive,
bind = SUPER, Space, exec, $menu
bind = SUPER, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = $control, D, exec, ~/.scripts/rofi-dict.sh

# script binds
bind = SUPER_SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER_SHIFT, P, exec, ~/.config/waybar/scripts/colorpicker.sh
bind = SUPER_SHIFT, R, exec, ~/.config/hypr/scripts/screenrecord.sh
bind = SUPER_SHIFT, C, exec, ~/.config/hypr/scripts/camoverlay.sh
# camera overlay window overides
windowrule = match:title ^(camera-overlay)$, float on, border_size 3, pin on, move 1200 100, opacity 1.0 1.0 override override

# lock screen
bind = $control, L, exec,  hyprctl dispatch exit 

# toggle waybar
bind = $control, M, exec, pkill waybar || (waybar &)

# window management
bind = Alt, h, layoutmsg, cycleprev
bind = Alt, l, layoutmsg, cyclenext
bind = Alt, o, togglefloating,
bind = Alt, k, fullscreen, 1

bind = ALT_SHIFT, H, resizeactive, -60 0
bind = ALT_SHIFT, L, resizeactive, 60 0
bind = ALT_SHIFT, K, resizeactive, 0 -60
bind = ALT_SHIFT, J, resizeactive, 0 60

bindm = Alt, mouse:272, movewindow

# workspace management
bind = $control, 1, workspace, 1
bind = $control, 2, workspace, 2
bind = $control, 3, workspace, 3
bind = $control, 4, workspace, 4
bind = $control, 5, workspace, 5

bind = Alt, 1, movetoworkspace, 1
bind = Alt, 2, movetoworkspace, 2
bind = Alt, 3, movetoworkspace, 3
bind = Alt, 4, movetoworkspace, 4
bind = Alt, 5, movetoworkspace, 5

#scratchpad q
bind = $control, Q, togglespecialworkspace, scratchpad
bind = Alt, Q, movetoworkspace, special:scratchpad

# always open windows on correct workspaces
windowrule = workspace 1, match:class ^(vivaldi-snapshot).*
windowrule = workspace 2, match:class ^(vivaldi-ompi).*
windowrule = workspace 3, match:class kitty
windowrule = workspace 4, match:class obsidian

# media keys bindings 
bind = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -2
bind = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +2
#bind = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = ,XF86AudioMicMute, exec, ~/.config/hypr/scripts/transcribe.sh #whisper
bind = ,XF86MonBrightnessDown, exec, swayosd-client --min-brightness 0 --brightness -2
bind = ,XF86MonBrightnessUp, exec, swayosd-client --min-brightness 0 --brightness +2
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPrev, exec, playerctl previous
bind = ,XF86AudioNext, exec, playerctl next

# cursor
env = XCURSOR_SIZE,20
env = XCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_SIZE,20

source = ~/.config/colors/hyprland-colors.conf

cursor {
    no_hardware_cursors = true
		no_warps = false
		inactive_timeout = 0
}

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
exec-once = pactl set-card-profile 46 HiFi && pactl set-default-source effect_output.j413-mic && pactl set-source-mute effect_output.j413-mic 0 && pactl set-source-volume effect_output.j413-mic 150% && amixer -c 1 cset name='Jack ADC PGA' 24 && amixer -c 1 cset name='Jack ADC Preamp' 2
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# window manager prefs
general {
  layout = master
  resize_on_border = true
	gaps_in = 2
	gaps_out = 10,10,10,10
	border_size = 3
	col.active_border = $accent
	col.inactive_border = $inactive
}

master {
	mfact = 0.55
	new_on_active = after
	orientation = left
}

layerrule {
    name = rofi-blur
    match:namespace = rofi

    blur = off
    ignore_alpha = 0
}

layerrule {
    name = waybar-blur
    match:namespace = waybar

    blur = off
    ignore_alpha = 0
}

layerrule {
    name = swayosd-rules
    match:namespace = swayosd

    blur = off
    ignore_alpha = 0
}

decoration {
    shadow:enabled = false
    shadow:range = 30
    shadow:render_power = 9
    shadow:color = rgba(1a1a1a66)

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
		rounding = 10

    blur {
        enabled = false
        size = 5
        passes = 4
        new_optimizations = false
        vibrancy = 0.0
        ignore_opacity = true
        special = true
        popups = false
    }

    #screen_shader = ~/.config/hypr/shaders/crt.glsl
}



animations {
    enabled = false
    animation = windows, 1, 1, default
    animation = border, 1, 6, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
    animation = specialWorkspace, 1, 3, default, slidevert
}

gesture = 3, horizontal, workspace
gesture = 3, up, special, scratchpad

input {
  kb_options = caps:swapescape #ctrl:swap_lwin_lctl
	follow_mouse = 1

# trackpad
touchpad {
  tap-to-click = false
  natural_scroll = true
	clickfinger_behavior = true
	drag_lock = true
	scroll_factor = 0.25
	disable_while_typing = true
    }
}

# Ignore maximize requests from apps. You'll probably like this.
#windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

