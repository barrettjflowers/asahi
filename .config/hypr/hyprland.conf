exec-once = hyprlock
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

$control = Super
$command = Control
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun

monitor = eDP-1,1920x1200,0x0,1.6
exec-once = hyprpaper
exec-once = systemctl --user start rclone-obsidian.timer
exec-once = vivaldi
exec-once = [workspace 4 silent] flatpak run md.obsidian.Obsidian
exec-once = kitty
exec-once = waybar

bind = $control, W, killactive,
bind = $control, E, exec, $fileManager
bind = Alt, O, togglefloating,
bind = Alt, F, fullscreen, 1
bind = $control, Space, exec, $menu
bind = $control, C, exec, ~/.config/waybar/scripts/colorpicker.sh
bind = SUPER_SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER_SHIFT, R, exec, ~/.config/hypr/scripts/screenrecord.sh

# lock screen
bind = $control, L, exec, hyprlock

# toggle waybar
bind = $control, M, exec, pkill waybar || (waybar &)

# window management
bindm = Alt, mouse:272, movewindow
bindm = Alt, mouse:273, resizewindow
bind = Alt, h, movefocus, l
bind = Alt, l, movefocus, r
bind = Alt, k, movefocus, u
bind = Alt, j, movefocus, d

bind = ALT_SHIFT, H, resizeactive, -60 0
bind = ALT_SHIFT, L, resizeactive, 60 0
bind = ALT_SHIFT, K, resizeactive, 0 -60
bind = ALT_SHIFT, J, resizeactive, 0 60

# workspaces
bind = $command, 1, workspace, 1
bind = $command, 2, workspace, 2
bind = $command, 3, workspace, 3
bind = $command, 4, workspace, 4
bind = $command, 5, workspace, 5

bind = Alt, 1, movetoworkspace, 1
bind = Alt, 2, movetoworkspace, 2
bind = Alt, 3, movetoworkspace, 3
bind = Alt, 4, movetoworkspace, 4
bind = Alt, 5, movetoworkspace, 5

# rules
windowrule = workspace 3, match:class kitty
windowrule = workspace 1, match:class ^(vivaldi-).*
windowrule = workspace 4, match:class obsidian
windowrule = workspace 2, match:initial_title ^(Microsoft Teams \(PWA\))

# media keys
bind = ,XF86AudioLowerVolume, exec, pactl -- set-sink-volume 0 -10%
bind = ,XF86AudioRaiseVolume, exec, pactl -- set-sink-volume 0 +10%
bind = ,XF86AudioMute, exec, pactl -- set-sink-mute 0 toggle
bind = ,XF86AudioMicMute, exec, pactl -- set-source-mute 0 toggle
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = ,XF86MonBrightnessUp, exec, brightnessctl s +5%

# cursor
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20

# SDDM sets XDG_CURRENT_DESKTOP=KDE, which confuses some apps
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# window manager prefs
general {
	gaps_in = 2
	gaps_out = 11
	border_size = 3
	col.active_border = 0xff66707D
	col.inactive_border = 0xff3e3e3e
}

decoration {
    shadow:enabled = false

    # Change transparency of focused and unfocused windows
    active_opacity = 0.85
    inactive_opacity = 0.85
    
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    animation = windows, 1, 2, default
    animation = border, 1, 6, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

input {
  kb_options = caps:swapescape #ctrl:swap_lwin_lctl
	follow_mouse = 0

# trackpad
touchpad {
  natural_scroll = true
	clickfinger_behavior = true
	drag_lock = true
	scroll_factor = 0.25
    }
}

exec-once = hyprctl reload

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
#windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

