# Force software encoder - skip NVENC/VAAPI/Vulkan probing (none work on Apple Silicon)
encoder = software

# Use all 8 CPU cores for encoding
min_threads = 8

# Absolute fastest x264 preset - minimal encoding latency
sw_preset = ultrafast

# Critical for low latency - disables look-ahead, frame reordering, B-frames
sw_tune = zerolatency

# Lower QP = sharper text and details (default 28 is muddy)
qp = 51

# Prevent frame drops from causing latency spikes (default = half of client framerate)
minimum_fps_target = 60
